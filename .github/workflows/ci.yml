name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    # Disposable Postgres for the Supabase-foundation test harness. This is a
    # throwaway CI database (NOT prod Supabase); superuser is available so we can
    # enable extensions and apply migrations against it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: groville_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      # backend/firebase.py parses FIREBASE_CREDENTIALS at import (no network call),
      # so CI supplies a throwaway, non-secret service-account cert to satisfy parsing.
      - name: Generate throwaway Firebase credentials
        run: |
          python - <<'PY'
          import json, os
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization

          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          pem = key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.TraditionalOpenSSL,
              serialization.NoEncryption(),
          ).decode()

          cred = {
              "type": "service_account",
              "project_id": "ci-dummy-project",
              "private_key_id": "ci-dummy-key-id",
              "private_key": pem,
              "client_email": "ci-dummy@ci-dummy-project.iam.gserviceaccount.com",
              "client_id": "000000000000000000000",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token",
              "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
              "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/ci-dummy%40ci-dummy-project.iam.gserviceaccount.com",
          }
          path = os.path.join(os.environ["RUNNER_TEMP"], "ci-firebase-credentials.json")
          with open(path, "w") as f:
              json.dump(cred, f)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"FIREBASE_CREDENTIALS={path}\n")
          PY

      # Enable the Postgres extensions the later migration slices will rely on.
      # psql ships on the GitHub ubuntu runner; superuser is available on this
      # throwaway CI database.
      - name: Enable Postgres extensions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d groville_test \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;" \
            -c "CREATE EXTENSION IF NOT EXISTS citext;"

      # Prove the Alembic scaffold applies cleanly against real Postgres. The
      # baseline migration is empty (no models yet), so this just creates the
      # alembic_version table. Alembic uses the DIRECT connection (see
      # migrations/env.py); the CI service has no pgBouncer pooler.
      - name: Apply database migrations
        working-directory: backend
        env:
          FLASK_APP: app
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/groville_test
          GROQ_API_KEY: test-groq-api-key
          SECRET_KEY: ci-dummy-secret-key
          TOKEN_ENCRYPTION_KEY: vSiYSo9eqy4MSVZNb3O7yNsqP2n0fWx6a6WFxwfnA-U=
        run: python -m flask db upgrade

      # SECRET_KEY and TOKEN_ENCRYPTION_KEY are read from the environment by the
      # app/services (the maintainer's local run gets them from backend/.env).
      # These are throwaway, non-secret CI values; TOKEN_ENCRYPTION_KEY is a valid Fernet key.
      # TEST_DATABASE_URL points pytest's Postgres harness at the throwaway CI
      # database (never prod Supabase).
      - name: Run tests
        working-directory: backend
        env:
          GROQ_API_KEY: test-groq-api-key
          SECRET_KEY: ci-dummy-secret-key
          TOKEN_ENCRYPTION_KEY: vSiYSo9eqy4MSVZNb3O7yNsqP2n0fWx6a6WFxwfnA-U=
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/groville_test
        run: python -m pytest tests/

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:5000
          DEMO_FALLBACK_ACCOUNT: 'true'
        run: npm run build
